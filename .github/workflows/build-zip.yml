name: Build Plugin Zip

on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build zip (exclude dev files via .distignore)
        run: |
          mkdir -p build
          rsync -a --exclude-from='.distignore' . build/wc-custom-ajax-search/
          cd build && zip -r ../wc-custom-ajax-search.zip wc-custom-ajax-search/

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: wc-custom-ajax-search
          path: wc-custom-ajax-search.zip
          retention-days: 90

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: wc-custom-ajax-search.zip
          generate_release_notes: true
